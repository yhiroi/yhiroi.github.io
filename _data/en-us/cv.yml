- title: Summary
  type: text
  contents: |
    <b>Yuichi HIROI, Ph.D.</b> is a Senior Research Scientist at <a href='https://lab.cluster.mu/en/'>Cluster Metaverse Lab</a>, Cluster Inc., and a Visiting Researcher at the <a href='https://www.ar.comp.isct.ac.jp/'>Yuta Itoh Lab</a>, Institute of Science Tokyo. He aims to expand human imagination and creativity through his research, especially on visual experiences, which spans mixed reality, display optics, vision measurement and augmentation, metaverse community analysis, and AI support for creative and exploratory activities. <br><br>

    He received his Ph.D. in Engineering from Tokyo Institute of Technology in March 2022. His previous research appointments include NTT Service Evolution Laboratory, Keio University, Sony CSL Kyoto, and the University of Tokyo. At Cluster, he studies how AI agents and behavioral analysis can support people's activities and community formation in metaverse platforms. Since October 2025, he has led the <a href='https://www.jst.go.jp/kisoken/presto/en/project/1112123/1112123_2025.html'>JST PRESTO project “Infrastructure for Human–AI Collaborative Community Building in the Metaverse”</a>. <br><br>

    He has also worked as a <a href='https://lamer-e.tv/'>freelance motion graphics designer</a> since 2006. Inspired by his own creative practice and communities where creators share their work and techniques, he investigates optical and display technologies grounded in human perception, as well as environments that support creation, exploration, and exchange. He seeks to help individual creative efforts inspire one another, giving rise to expressions and experiences no one could have envisioned alone.

