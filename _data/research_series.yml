    "image": "2025-community-analysis.png",
    "description": {
      "ja": "Social VRの行動ログから、人々の集まり方や交流、コミュニティの構造を分析しています。分析・可視化ツールの開発を通じて、バーチャル空間での体験とユーザの関心や価値選好、現実空間での行動意図との関係を調べています。",
      "en-us": "We analyze behavioral logs to understand how people gather, interact, and form communities in social VR. Analysis and visualization tools help reveal these patterns and examine how virtual experiences relate to users’ interests, values and preferences, and intentions to act in the physical world."
