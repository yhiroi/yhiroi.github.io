    "id": "beaming-displays",
    "title": "Beaming Displays",
    "image": "2026-beamstellar.png",
    "description": {
      "ja": "映像を投影する光学系を環境側に置き、身につける眼鏡を軽くするディスプレイを研究しています。高速な追跡・投影制御、複数プロジェクタの協調、薄型の導波路光学系の設計を通じて、頭の動きに追従する映像提示を探ります。",
      "en-us": "We study displays that place image projection in the environment to reduce the hardware worn on the head. Through high-speed tracking and projection, coordination between multiple projectors, and the design of thin waveguide optics, we explore image presentation that follows head movements."
    },
