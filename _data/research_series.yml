    "id": "occlusion-capable-displays",
    "title": "Occlusion-Capable Displays",
    "image": "2021-focal-surface-occlusion.jpg",
    "description": {
      "ja": "現実の光を部分的に遮り、バーチャルな物体が実物の手前にあるように見せる光学シースルーディスプレイを研究しています。焦点に応じた遮蔽のぼけや光に応答する材料の制御を通じて、自然な前後関係と見え方の実現を目指します。",
      "en-us": "We study optical see-through displays that selectively block real-world light so virtual objects can appear in front of physical objects. The work addresses focus-dependent occlusion, responsive optical materials, and their effects on depth perception."
    },
