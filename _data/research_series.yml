      "ja": "高度な3次元表現をディスプレイに取り入れ、視覚体験の可能性を広げる研究です。視点に応じた見え方の表現を通じて、新たな視覚的質感の提示や光学系の複雑な歪みの補正を探究しています。",
      "en-us": "We bring advanced 3D representations into displays to expand the possibilities of visual experience. By modeling view-dependent appearance, we explore new ways to present material qualities and compensate for complex distortions in display optics."
